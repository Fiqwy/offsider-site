<!doctype html><html><head><meta charset="utf-8"><link rel="stylesheet" href="_fonts.css">
<style>
html,body{margin:0;width:1640px;height:624px;overflow:hidden;background:#0a0e1a;
  font-family:"Hanken Grotesk",system-ui,sans-serif;color:#f6f8fc;-webkit-font-smoothing:antialiased}
.stage{position:relative;width:1640px;height:624px;overflow:hidden;
  background:radial-gradient(900px 600px at 1340px 120px, rgba(47,107,255,.30), rgba(47,107,255,0) 70%),
  linear-gradient(180deg,#0e1424,#0a0e1a)}
.grid{position:absolute;inset:0;background-image:radial-gradient(rgba(255,255,255,.075) 1px,transparent 1.2px);
  background-size:28px 28px;mask-image:linear-gradient(180deg,rgba(0,0,0,.9),transparent 90%)}
/* oversized brand mark bleeding off the right edge, outside the mobile safe zone on purpose */
.bigmark{position:absolute;right:-150px;top:-140px;width:760px;height:760px;opacity:.9}
.brand{position:absolute;left:180px;top:60px;display:flex;align-items:center;gap:16px}
.brand .mark{width:46px;height:46px}.brand span{font-weight:600;font-size:29px;letter-spacing:-.01em}
.copy{position:absolute;left:180px;top:160px;width:1000px}
h1{margin:0;font-weight:800;font-size:96px;line-height:.95;letter-spacing:-.035em;color:#fff}
h1 .ital{font-family:"Instrument Serif",Georgia,serif;font-style:italic;font-weight:400;color:#7aa2ff}
.sub{margin:28px 0 0;font-size:28px;line-height:1.28;color:#c7cede;font-weight:500;max-width:900px}
.sub b{color:#f6f8fc;font-weight:600}
.cta{position:absolute;right:180px;top:52px;display:inline-flex;align-items:center;gap:18px;background:#fff;color:#0b1220;
  border-radius:999px;padding:0 30px 0 26px;height:62px;font-weight:700;font-size:23px;letter-spacing:-.01em;box-shadow:0 10px 30px rgba(0,0,0,.35)}
.cta .dot{width:12px;height:12px;border-radius:50%;background:#16a34a;box-shadow:0 0 0 5px rgba(22,163,74,.22)}
.cta .url{font-weight:500;color:#5b6474;padding-left:18px;border-left:1.5px solid rgba(11,18,32,.14)}
</style></head><body><div class="stage"><div class="grid"></div>
<svg class="bigmark" viewBox="0 0 64 64" aria-hidden="true"><g fill="none" stroke="rgba(122,162,255,.22)" stroke-width="2.2" stroke-linejoin="round" stroke-linecap="round">
<rect x="13" y="13" width="24" height="24" rx="6"/><rect x="27" y="27" width="24" height="24" rx="6"/><path d="M21 37 L31 37"/></g></svg>
<div class="brand"><svg class="mark" viewBox="0 0 64 64" aria-hidden="true"><rect width="64" height="64" rx="15" fill="#2f6bff"/><g fill="none" stroke="#fff" stroke-width="6" stroke-linejoin="round" stroke-linecap="round"><rect x="13" y="13" width="24" height="24" rx="6"/><rect x="27" y="27" width="24" height="24" rx="6"/><path d="M21 37 L31 37"/></g></svg><span>Applied Intelligence</span></div>
<div class="copy"><h1>Hire a crew that<br>never clocks <span class="ital">off.</span></h1>
<p class="sub">Done-for-you AI staff for Australian businesses. <b>Every call answered, every lead chased, every job booked.</b></p></div>
<div class="cta"><span class="dot"></span>Book your free Leak Audit<span class="url">appliedintelligence.biz/audit</span></div>
</div></body></html>
